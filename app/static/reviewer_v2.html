<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HistoAnnotator · Review</title>
  <script src="/static/vendor/openseadragon/openseadragon.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#0d1117;--panel:#151b23;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--good:#3fb950}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif}
    button,textarea{font:inherit;background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 9px}button{cursor:pointer}button:disabled{opacity:.45}.good{background:#17351f;border-color:#2ea043}
    .app{height:100vh;display:grid;grid-template-rows:auto 1fr auto;min-height:0}.top{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#11161d;border-bottom:1px solid var(--line)}.top h1{font-size:16px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.main{display:grid;grid-template-columns:1fr 300px;min-height:0}.viewer-area{min-width:0;min-height:0;position:relative;padding:8px}.side{border-left:1px solid var(--line);background:#11161d;padding:12px;overflow:auto}
    .split{height:100%;display:grid;gap:8px}.split.n2{grid-template-columns:1fr 1fr}.split.n3{grid-template-columns:repeat(3,1fr)}.view{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#080b0f}.osd{position:absolute;inset:30px 0 0}.view-title{height:30px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#141a21}.dot{width:9px;height:9px;border-radius:50%}.overlay-svg{position:absolute;inset:30px 0 0;pointer-events:none}.overlay-svg path{fill-opacity:.14;stroke-width:2.5;vector-effect:non-scaling-stroke}.overlay-panel{height:100%;position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden}.overlay-panel .osd{inset:0}.overlay-panel .overlay-svg{inset:0}
    .card{padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:9px;margin-bottom:10px}.title{font-weight:700}.candidates{display:grid;gap:6px;margin-top:8px}.candidate{display:flex;gap:7px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:7px}.candidate.selected{border-color:var(--accent)}textarea{width:100%;resize:vertical}.footer{display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid var(--line);background:#11161d}.footer .spacer{flex:1}.status{font-size:12px}.complete{color:#7ee787}
    @media(max-width:850px){.main{grid-template-columns:1fr}.side{position:absolute;right:8px;top:58px;width:280px;max-height:65vh;z-index:30;border:1px solid var(--line);border-radius:10px}.split.n3{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><h1>Review</h1><span id="progress" class="muted"></span><span style="flex:1"></span><button id="splitBtn">Split</button><button id="overlayBtn">Overlay</button></header>
  <div class="main">
    <section class="viewer-area"><div id="split" class="split"></div><div id="overlayPanel" class="overlay-panel" hidden><div id="overlayOsd" class="osd"></div></div></section>
    <aside class="side">
      <div class="card"><div class="title">Choose the best candidate</div><div id="candidateList" class="candidates"></div></div>
      <div class="card"><label><input id="challenging" type="checkbox"> Challenging case</label></div>
      <div class="card"><div class="title">Comment</div><textarea id="comment" rows="5" placeholder="Optional comment for this case"></textarea></div>
      <div class="card"><div class="title">General review comment</div><textarea id="generalComment" rows="4" placeholder="Optional overall comment"></textarea></div>
      <div id="status" class="status muted">Loading…</div>
    </aside>
  </div>
  <footer class="footer"><button id="prev">← Previous</button><button id="defer">Defer</button><span class="spacer"></span><button id="accept" class="good">Accept & next</button><button id="finish" class="good" disabled>Finish review</button></footer>
</div>
<script>
(() => {
  "use strict";
  const $=id=>document.getElementById(id), token=decodeURIComponent(location.pathname.split("/").filter(Boolean).pop()||"");
  const state={payload:null,index:0,selected:null,mode:"split",viewers:[],overlayViewer:null,tileSource:null,saveTimer:null,generalTimer:null};
  async function json(url,options={}){const r=await fetch(url,{cache:"no-store",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});if(!r.ok){let d=`HTTP ${r.status}`;try{const p=await r.json();d=p.detail||d;}catch{}throw new Error(d);}return r.json();}
  const api=path=>`/api/review-v2/share/${encodeURIComponent(token)}${path}`;
  const current=()=>state.payload?.groups?.[state.index]||null;
  function polygons(g){if(!g)return[];if(g.type==="Polygon")return[g.coordinates||[]];if(g.type==="MultiPolygon")return g.coordinates||[];if(g.type==="GeometryCollection")return(g.geometries||[]).flatMap(polygons);return[];}
  function setStatus(text){$("status").textContent=text;}
  function updateProgress(){const p=state.payload.progress||{};$("progress").textContent=`Case ${Math.min(state.index+1,p.total||0)} / ${p.total||0} · ${p.accepted||0} accepted${p.deferred?` · ${p.deferred} deferred`:""}`;$("finish").disabled=(p.accepted||0)!==(p.total||0);}
  async function buildTileSource(){const imageId=state.payload.imageId,info=await json(`/api/images/${encodeURIComponent(imageId)}/info`);let display={imageType:"he"};try{display=await json(`/api/images/${encodeURIComponent(imageId)}/display-config`);}catch{}if(info.directRaster){state.tileSource={type:"image",url:`/api/images/${encodeURIComponent(imageId)}/original`};return;}const width=Number(info.width||0),height=Number(info.height||0),max=Number(info.levelCount)-1,query=new URLSearchParams({view:"original",image_type:String(display.imageType||"he")}).toString();state.tileSource={width,height,tileSize:Number(info.tileSize||512),tileOverlap:Number(info.tileOverlap||0),minLevel:0,maxLevel:Number.isFinite(max)?max:Math.ceil(Math.log2(Math.max(width,height))),getTileUrl:(level,x,y)=>`/api/images/${encodeURIComponent(imageId)}/tiles/${level}/${x}_${y}.jpeg?${query}`};}
  const createViewer=el=>OpenSeadragon({element:el,tileSources:state.tileSource,showNavigationControl:false,showNavigator:false,gestureSettingsMouse:{clickToZoom:false,dblClickToZoom:true,scrollToZoom:true},gestureSettingsTouch:{pinchToZoom:true,flickEnabled:true}});
  function svgPoint(v,p){const q=v.viewport.imageToViewerElementCoordinates(new OpenSeadragon.Point(Number(p[0]),Number(p[1])));return[q.x,q.y];}
  function pathD(v,g){let d="";for(const poly of polygons(g))for(const ring of poly||[]){if(!ring?.length)continue;let p=svgPoint(v,ring[0]);d+=`M ${p[0]} ${p[1]} `;for(let i=1;i<ring.length;i++){p=svgPoint(v,ring[i]);d+=`L ${p[0]} ${p[1]} `;}d+="Z ";}return d;}
  function addOverlay(v,g,color,panel,full=false){let svg=panel.querySelector(":scope > .overlay-svg");if(!svg){svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.classList.add("overlay-svg");panel.appendChild(svg);}const rect=(full?panel:panel.querySelector(".osd")).getBoundingClientRect();svg.setAttribute("viewBox",`0 0 ${Math.max(1,rect.width)} ${Math.max(1,rect.height)}`);if(!g)return;const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",pathD(v,g));p.setAttribute("stroke",color);p.setAttribute("fill",color);svg.appendChild(p);}
  function fit(v){const b=current()?.bbox;if(!b||!v?.viewport)return;const[x1,y1,x2,y2]=b,w=Math.max(1,x2-x1),h=Math.max(1,y2-y1),pad=Math.max(w,h)*.15+8;try{v.viewport.fitBounds(v.viewport.imageToViewportRectangle(x1-pad,y1-pad,w+2*pad,h+2*pad),true);}catch{}}
  function destroy(){for(const v of state.viewers){try{v.destroy();}catch{}}state.viewers=[];if(state.overlayViewer){try{state.overlayViewer.destroy();}catch{}state.overlayViewer=null;}$("split").innerHTML="";$("overlayPanel").querySelectorAll(":scope > .overlay-svg").forEach(x=>x.remove());$("overlayOsd").innerHTML="";}
  function sync(source){if(state.mode!=="split"||source._syncing)return;const center=source.viewport.getCenter(),zoom=source.viewport.getZoom();for(const v of state.viewers){if(v===source)continue;v._syncing=true;v.viewport.panTo(center,true);v.viewport.zoomTo(zoom,null,true);v._syncing=false;}}
  async function render(){destroy();const g=current();if(!g)return;if(state.mode==="split"){$("split").hidden=false;$("overlayPanel").hidden=true;const cs=g.candidates||[];$("split").className=`split n${Math.max(2,Math.min(3,cs.length))}`;cs.forEach(c=>{const panel=document.createElement("div");panel.className="view";panel.innerHTML=`<div class="view-title"><span class="dot" style="background:${c.color}"></span>${c.label}${c.empty?" · No annotation":""}</div><div class="osd"></div>`;$("split").appendChild(panel);const v=createViewer(panel.querySelector(".osd"));state.viewers.push(v);const draw=()=>{const svg=panel.querySelector(":scope > .overlay-svg");if(svg)svg.innerHTML="";addOverlay(v,c.geometry,c.color,panel);};v.addHandler("open",()=>{fit(v);draw();});["animation","pan","zoom","resize"].forEach(ev=>v.addHandler(ev,()=>{draw();if(["animation","pan","zoom"].includes(ev))sync(v);}));});}else{$("split").hidden=true;$("overlayPanel").hidden=false;const panel=$("overlayPanel");state.overlayViewer=createViewer($("overlayOsd"));const draw=()=>{let svg=panel.querySelector(":scope > .overlay-svg");if(svg)svg.innerHTML="";for(const c of g.candidates||[])addOverlay(state.overlayViewer,c.geometry,c.color,panel,true);};state.overlayViewer.addHandler("open",()=>{fit(state.overlayViewer);draw();});["animation","pan","zoom","resize"].forEach(ev=>state.overlayViewer.addHandler(ev,draw));}}
  function renderControls(){const g=current();if(!g)return;const d=g.decision||{};state.selected=Number.isInteger(d.decisionCandidate)?d.decisionCandidate:null;$("candidateList").innerHTML=(g.candidates||[]).map(c=>`<label class="candidate ${state.selected===c.index?"selected":""}"><input type="radio" name="candidate" value="${c.index}" ${state.selected===c.index?"checked":""}><span class="dot" style="background:${c.color}"></span><span>${c.label}${c.empty?" · No annotation":""}</span></label>`).join("");$("candidateList").querySelectorAll('input[name="candidate"]').forEach(el=>el.addEventListener("change",()=>{state.selected=Number(el.value);renderControls();}));$("challenging").checked=Boolean(d.challenging);$("comment").value=d.comment||"";updateProgress();}
  async function saveDecision({deferred=false,advance=false}={}){const g=current();if(!g)return;if(!deferred&&!Number.isInteger(state.selected)){setStatus("Choose a candidate first.");return;}const result=await json(api(`/groups/${encodeURIComponent(g.id)}`),{method:"PUT",body:JSON.stringify({decisionCandidate:deferred?null:state.selected,challenging:$("challenging").checked,deferred,comment:$("comment").value})});g.decision=result.decision;state.payload.progress=result.progress;updateProgress();setStatus(deferred?"Deferred.":"Decision saved.");if(advance){const next=nextUnresolved(state.index+1);if(next>=0){state.index=next;renderControls();await render();}else setStatus("All non-deferred cases reviewed. Resolve deferred cases before finishing.");}}
  function nextUnresolved(start=0){const gs=state.payload.groups||[];for(let k=0;k<gs.length;k++){const i=(start+k)%gs.length,d=gs[i].decision||{};if(!Number.isInteger(d.decisionCandidate))return i;}return -1;}
  async function load(){try{state.payload=await json(api(""));await buildTileSource();const next=nextUnresolved(0);state.index=next>=0?next:0;renderControls();$("generalComment").value=state.payload.generalComment||"";await render();setStatus("Reviewer mode. Source identities are not included in this page.");}catch(e){setStatus(e.message);}}
  $("splitBtn").addEventListener("click",()=>{state.mode="split";render();});$("overlayBtn").addEventListener("click",()=>{state.mode="overlay";render();});$("prev").addEventListener("click",()=>{if(!state.payload)return;state.index=(state.index-1+state.payload.groups.length)%state.payload.groups.length;renderControls();render();});$("defer").addEventListener("click",()=>saveDecision({deferred:true,advance:true}).catch(e=>setStatus(e.message)));$("accept").addEventListener("click",()=>saveDecision({advance:true}).catch(e=>setStatus(e.message)));
  $("challenging").addEventListener("change",()=>{clearTimeout(state.saveTimer);state.saveTimer=setTimeout(()=>saveDecision({advance:false}).catch(()=>{}),250);});
  $("comment").addEventListener("input",()=>{clearTimeout(state.saveTimer);state.saveTimer=setTimeout(()=>{const g=current();if(!g)return;json(api(`/groups/${encodeURIComponent(g.id)}`),{method:"PUT",body:JSON.stringify({decisionCandidate:Number.isInteger(state.selected)?state.selected:null,challenging:$("challenging").checked,deferred:Boolean(g.decision?.deferred),comment:$("comment").value})}).then(r=>{g.decision=r.decision;state.payload.progress=r.progress;updateProgress();}).catch(()=>{});},450);});
  $("generalComment").addEventListener("input",()=>{clearTimeout(state.generalTimer);state.generalTimer=setTimeout(()=>json(api("/general-comment"),{method:"PUT",body:JSON.stringify({comment:$("generalComment").value})}).catch(()=>{}),500);});
  $("finish").addEventListener("click",async()=>{try{const r=await json(api("/complete"),{method:"POST",body:"{}"});setStatus(`Completed. Saved ${r.features} reviewed annotations to “${r.annotationFile}”.`);$("status").classList.add("complete");$("finish").disabled=true;$("accept").disabled=true;$("defer").disabled=true;}catch(e){setStatus(e.message);}});
  window.addEventListener("keydown",e=>{if(e.target?.matches("textarea,input"))return;if(/^[1-3]$/.test(e.key)){const n=Number(e.key)-1;if(n<(current()?.candidates?.length||0)){state.selected=n;renderControls();}}else if(e.key==="Enter")saveDecision({advance:true}).catch(err=>setStatus(err.message));});
  load();
})();
</script>
</body>
</html>
