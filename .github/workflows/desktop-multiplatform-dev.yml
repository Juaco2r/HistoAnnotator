name: Desktop Multi-platform Dev Build

on:
  push:
    branches:
      - v1.2.0-local-mode
    paths:
      - "app/**"
      - "desktop/**"
      - "requirements.txt"
      - "requirements-desktop.txt"
      - "HistoAnnotatorDesktop.spec"
      - "scripts/prepare_desktop_web_assets.py"
      - ".github/workflows/desktop-multiplatform-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-multiplatform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: HistoAnnotator-Desktop-Windows-x64-dev7
            executable: dist/HistoAnnotatorDesktop/HistoAnnotatorDesktop.exe

          - os: ubuntu-latest
            label: Linux x64
            artifact: HistoAnnotator-Desktop-Linux-x64-dev7
            executable: dist/HistoAnnotatorDesktop/HistoAnnotatorDesktop

          - os: macos-latest
            label: macOS Apple Silicon
            artifact: HistoAnnotator-Desktop-macOS-AppleSilicon-dev7
            executable: dist/HistoAnnotatorDesktop/HistoAnnotatorDesktop

          - os: macos-15-intel
            label: macOS Intel
            artifact: HistoAnnotator-Desktop-macOS-Intel-dev7
            executable: dist/HistoAnnotatorDesktop/HistoAnnotatorDesktop

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Linux runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxkbcommon-x11-0 \
            libxrandr2

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-desktop.txt

      - name: Prepare Desktop web assets
        shell: bash
        run: |
          python scripts/prepare_desktop_web_assets.py
          test -f app/static/vendor/openseadragon/openseadragon.min.js

      - name: Build portable Desktop app
        shell: bash
        run: |
          python -m PyInstaller \
            --clean \
            --noconfirm \
            HistoAnnotatorDesktop.spec

      - name: Desktop self-test
        shell: bash
        run: |
          "${{ matrix.executable }}" --self-test

      - name: Show artifact contents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("dist/HistoAnnotatorDesktop")
          assert root.is_dir(), root
          files = [p for p in root.rglob("*") if p.is_file()]
          print("files:", len(files))
          print("bytes:", sum(p.stat().st_size for p in files))
          for p in files[:30]:
              print(p)
          PY

      - name: Upload portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/HistoAnnotatorDesktop/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
