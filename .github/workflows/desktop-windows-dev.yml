name: Desktop Windows Dev Build

on:
  push:
    branches:
      - v1.2.0-local-mode
    paths:
      - "app/**"
      - "desktop/**"
      - "requirements.txt"
      - "requirements-desktop.txt"
      - "HistoAnnotatorDesktop.spec"
      - ".github/workflows/desktop-windows-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-desktop.txt

      - name: Verify OpenSlide before packaging
        shell: pwsh
        run: |
          python -c "import openslide; print('OpenSlide Python:', openslide.__version__); print('OpenSlide library:', openslide.__library_version__)"

      - name: Validate desktop source
        shell: pwsh
        run: |
          python -m py_compile desktop\config.py desktop\network.py desktop\server_runner.py desktop\server_control.py desktop\desktop_app.py desktop\entrypoint.py

      - name: Build standalone Windows folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean HistoAnnotatorDesktop.spec

      - name: Run packaged self-test
        shell: pwsh
        run: |
          .\dist\HistoAnnotatorDesktop\HistoAnnotatorDesktop.exe --self-test

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $name = "HistoAnnotator-Desktop-Windows-x64-dev1b"
          Compress-Archive `
            -Path ".\dist\HistoAnnotatorDesktop\*" `
            -DestinationPath ".\$name.zip" `
            -CompressionLevel Optimal
          Get-FileHash ".\$name.zip" -Algorithm SHA256 |
            Format-List

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: HistoAnnotator-Desktop-Windows-x64-dev1b
          path: HistoAnnotator-Desktop-Windows-x64-dev1b.zip
          if-no-files-found: error
          retention-days: 14
